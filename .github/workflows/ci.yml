name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Cache cloudflared build
        id: cloudflared-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: cloudflared-${{ hashFiles('scripts/cloudflared-version.txt', 'scripts/build-cloudflared.sh') }}
      - name: Build cloudflared for Android
        if: steps.cloudflared-cache.outputs.cache-hit != 'true'
        run: scripts/build-cloudflared.sh
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
