name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Cache cloudflared build
        id: cloudflared-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: cloudflared-${{ hashFiles('scripts/cloudflared-version.txt', 'scripts/build-cloudflared.sh') }}
      - name: Build cloudflared for Android
        if: steps.cloudflared-cache.outputs.cache-hit != 'true'
        run: scripts/build-cloudflared.sh
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The companion app (companion/): a client for the gateway, for another phone. It doesn't bundle
  # cloudflared, so it builds on its own, in parallel with the gateway.
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The release variant is built too (signed with the debug key here), so that a tagged
      # release is never the first time it is built.
      - name: Build companion APKs and run unit tests
        run: |
          ./gradlew --no-daemon :companion:assembleDebug :companion:testDebugUnitTest :companion:assembleRelease
          # The release workflow copies this file, so fail here if it ever moves.
          test -f companion/build/outputs/apk/release/companion-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-sms-companion-debug-apk
          path: companion/build/outputs/apk/debug/*.apk
          if-no-files-found: error
