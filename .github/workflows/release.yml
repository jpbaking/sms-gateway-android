name: Release

# Push a tag to publish an APK on the Releases page:
#   v0.1.0-dev.1, v0.1.0-alpha.1, v0.1.0-beta.1  -> pre-release
#   v1.0.0                                        -> full release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. See README > Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Tag "v0.1.0-alpha.1" -> versionName "0.1.0-alpha.1". The run number only ever grows,
          # so each release can install over the previous one.
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/sms-gateway-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
